[project]
name = "modelctl"
version = "0.1.0"
description = "Provider-neutral model control plane for OMP and LiteLLM fleets"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "cryptography>=42.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.4", "types-PyYAML>=6.0"]

[project.scripts]
modelctl-validate = "modelctl.cli.validate:main"
modelctl-host-agent = "modelctl.agents.host.__main__:main"
modelctl-render = "modelctl.adapters.litellm.cli:main"
modelctl-controller = "modelctl.controller.cli:main"
modelctl-quota-collector = "modelctl.telemetry.cli:main"
modelctl-event-forwarder = "modelctl.telemetry.event_cli:main"
modelctl-operator = "modelctl.operator.cli:main"
modelctl-litellm-receiver = "modelctl.adapters.litellm.receiver_cli:main"
modelctl-omp-selector = "modelctl.adapters.omp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelctl"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = ["--import-mode=importlib"]